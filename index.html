<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="description" content="LinguaPop - تعلم الفرنسية والإيطالية كل لغة في عالمها الخاص.">
  <title>LinguaPop | تعلّم اللغات بطريقتك</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="LinguaPop الصفحة الرئيسية">
        <span class="brand-mark">L</span>
        <span>LinguaPop</span>
      </a>
      <div class="topbar-actions"><span class="top-note">مساحتك الصغيرة لتعلّم اللغات</span><button class="theme-toggle" id="theme-toggle" type="button" aria-label="تفعيل الوضع الليلي" aria-pressed="false" title="الوضع الليلي"><span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">ليلي</span></button></div>
    </header>

    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow">كلمة جديدة، عالم جديد</p>
        <h1 id="hero-title">اختاري اللغة،<br><span>وافتحي عالمها.</span></h1>
        <p class="hero-description">رحلتان منفصلتان، لكل واحدة أجواؤها وكلماتها وتقدّمها الخاص.</p>
      </div>
      <div class="hero-decoration" aria-hidden="true">
        <span class="spark spark-one">✦</span>
        <span class="spark spark-two">✧</span>
        <span class="hero-letter">Aa</span>
        <span class="hero-orbit"></span>
      </div>
    </section>

    <section class="language-section" aria-labelledby="choose-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">ابدئي من هنا</p>
          <h2 id="choose-title">أي عالم نزوره اليوم؟</h2>
        </div>
        <span class="separate-note"><span class="dot"></span> تعلّم منفصل لكل لغة</span>
      </div>

      <div class="language-grid">
        <button class="language-card italian-card" type="button" data-language="italian" aria-label="اختيار اللغة الإيطالية">
          <span class="flag flag-italian" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="card-stamp" aria-hidden="true">Ciao!</span>
          <span class="card-content">
            <span class="card-kicker">IL MONDO ITALIANO</span>
            <span class="language-name">الإيطالية</span>
            <span class="language-subtitle">Italiano</span>
            <span class="card-action">ادخلي العالم الإيطالي <span aria-hidden="true">←</span></span>
          </span>
          <span class="card-art italian-art" aria-hidden="true">
            <span class="sun"></span><span class="dome"></span><span class="building"></span><span class="plant">✳</span>
          </span>
        </button>

        <button class="language-card french-card" type="button" data-language="french" aria-label="اختيار اللغة الفرنسية">
          <span class="flag flag-french" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="card-stamp" aria-hidden="true">Bonjour!</span>
          <span class="card-content">
            <span class="card-kicker">LE MONDE FRANÇAIS</span>
            <span class="language-name">الفرنسية</span>
            <span class="language-subtitle">Français</span>
            <span class="card-action">ادخلي العالم الفرنسي <span aria-hidden="true">←</span></span>
          </span>
          <span class="card-art french-art" aria-hidden="true">
            <span class="moon"></span><span class="tower"><i></i><i></i><i></i></span><span class="cloud">〰</span><span class="flower">✿</span>
          </span>
        </button>
      </div>
    </section>

    <footer class="footer">
      <span>خطوة صغيرة كل يوم تكفي.</span>
      <span class="footer-mark">LINGUAPOP <span>•</span> 01</span>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
